<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>ProofBridge — From Reported Problems to Verified Outcomes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes pbPreSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes pbPrePulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      .pb-pre-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #111318;
        color: #F5F5F5;
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        z-index: 9999;
      }
      .pb-pre-ring {
        width: 96px;
        height: 96px;
        border-radius: 9999px;
        border: 2px solid rgba(43, 48, 58, 0.8);
        border-top-color: #FF8A32;
        border-right-color: #22C55E;
        animation: pbPreSpin 1.1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      }
      .pb-pre-logo {
        position: absolute;
        width: 48px;
        height: 48px;
        animation: pbPrePulse 1.8s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-[#111318] text-[#F5F5F5] antialiased selection:bg-[#FF8A32]/30 selection:text-[#F5F5F5]">
    <div id="root">
      <div class="pb-pre-boot" aria-label="Loading ProofBridge">
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <div class="pb-pre-ring"></div>
          <img src="/logo.svg" alt="" class="pb-pre-logo" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
